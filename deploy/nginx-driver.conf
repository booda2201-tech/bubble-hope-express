# Nginx — paste inside the site's `server { ... }` block.
# The build output (dist/bubble-hope-express/*) must live in <root>/driver/,
# e.g. /var/www/html/driver/index.html when root is /var/www/html.

location = /driver {
    return 301 /driver/;
}

location /driver/ {
    root /var/www/html;
    try_files $uri $uri/ /driver/index.html;

    # Hashed bundles never change, so they can be cached for a year
    location ~* \.[0-9a-f]{16,}\.(js|css|woff2?)$ {
        root /var/www/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Never cache the entry files, otherwise drivers keep running an old build
location ~ ^/driver/(index\.html|sw\.js|manifest\.webmanifest)$ {
    root /var/www/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
