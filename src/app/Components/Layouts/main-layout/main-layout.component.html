<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/orders">
        <img src="assets/brand/logo.png" alt="Bubble Hope" />
        <span class="express">{{ 'express' | translate }}</span>
      </a>

      <div class="tools">
        <div class="driver" *ngIf="auth.driver$ | async as driver">
          <span class="avatar"><i class="bi bi-person-fill"></i></span>
          <span class="meta">
            <small>{{ 'driver' | translate }}</small>
            <b dir="auto">{{ driver.fullName }}</b>
          </span>
        </div>

        <button type="button" class="chip" (click)="language.toggle()">
          <i class="bi bi-translate"></i>
          <span>{{ 'lang' | translate }}</span>
        </button>

        <button type="button" class="chip out" (click)="logout()" [attr.aria-label]="'logout' | translate">
          <i class="bi bi-box-arrow-left flip"></i>
          <span class="label">{{ 'logout' | translate }}</span>
        </button>
      </div>
    </div>
  </header>

  <main class="desk">
    <router-outlet></router-outlet>
  </main>
</div>
